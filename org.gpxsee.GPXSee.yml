app-id: org.gpxsee.GPXSee
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: gpxsee
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --filesystem=home
rename-desktop-file: gpxsee.desktop
rename-icon: gpxsee
rename-mime-file: gpxsee.xml
rename-appdata-file: gpxsee.appdata.xml
modules:
  - name: gpxsee
    buildsystem: qmake
    post-install:
      - lrelease gpxsee.pro
    sources:
      - type: archive
        url: https://github.com/tumic0/GPXSee/archive/refs/tags/16.19.tar.gz
        sha256: fedfaa21bd06157510e2f36a1e3289c5203aa8f896fde1f1ed7fc86e4514b6e4
      - type: patch
        path: gpxsee-appdata.patch
