app-id: org.gpxsee.GPXSee
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: gpxsee
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --filesystem=home
rename-desktop-file: gpxsee.desktop
rename-icon: gpxsee
rename-mime-file: gpxsee.xml
rename-appdata-file: gpxsee.appdata.xml
modules:
  - name: gpxsee
    buildsystem: qmake
    post-install:
      - lrelease gpxsee.pro
    sources:
      - type: archive
        url: https://github.com/tumic0/GPXSee/archive/refs/tags/16.13.tar.gz
        sha256: b6ac500415db7595c70a6a985a838ca88d172e0bc79f21057210a6bb15169d90
      - type: patch
        path: gpxsee-appdata.patch
