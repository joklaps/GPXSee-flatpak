app-id: org.gpxsee.GPXSee
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: gpxsee
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --filesystem=home
rename-desktop-file: gpxsee.desktop
rename-icon: gpxsee
rename-mime-file: gpxsee.xml
rename-appdata-file: gpxsee.appdata.xml
modules:
  - name: gpxsee
    buildsystem: qmake
    post-install:
      - lrelease gpxsee.pro
    sources:
      - type: archive
        url: https://github.com/tumic0/GPXSee/archive/refs/tags/16.15.tar.gz
        sha256: 2456cbfa127b12bb971760175420aba6369d771f3a586558501d261964ccf333
      - type: patch
        path: gpxsee-appdata.patch
