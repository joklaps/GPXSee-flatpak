app-id: org.gpxsee.GPXSee
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: gpxsee
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --filesystem=home
rename-desktop-file: gpxsee.desktop
rename-icon: gpxsee
rename-mime-file: gpxsee.xml
rename-appdata-file: gpxsee.appdata.xml
modules:
  - name: gpxsee
    buildsystem: qmake
    post-install:
      - lrelease gpxsee.pro
    sources:
      - type: archive
        url: https://github.com/tumic0/GPXSee/archive/refs/tags/16.16.tar.gz
        sha256: e7955c23df5aa733648ba6094501f294af0e46c9d3f845adb20a2459447d5070
      - type: patch
        path: gpxsee-appdata.patch
