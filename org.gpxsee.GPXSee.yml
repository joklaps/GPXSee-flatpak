app-id: org.gpxsee.GPXSee
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: gpxsee
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --filesystem=home
rename-desktop-file: gpxsee.desktop
rename-icon: gpxsee
rename-mime-file: gpxsee.xml
rename-appdata-file: gpxsee.appdata.xml
modules:
  - name: gpxsee
    buildsystem: qmake
    post-install:
      - lrelease gpxsee.pro
    sources:
      - type: archive
        url: https://github.com/tumic0/GPXSee/archive/refs/tags/16.17.tar.gz
        sha256: aa9d829b05cd1c7d7371aaaf7612e9bce770e649e81b65a5edbec092efb559ba
      - type: patch
        path: gpxsee-appdata.patch
